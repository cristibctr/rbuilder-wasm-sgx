[package]
name = "block-builder-types"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/flashbots/rbuilder"
repository = "https://github.com/flashbots/rbuilder"
description = "Shared types for block builder components"

[dependencies]
serde = { version = "1.0.210", features = ["derive"], default-features = false }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-consensus = { version = "0.11.1", features = ["serde"], default-features = false }
alloy-eips = { version = "0.11.1", optional = true, default-features = false }
alloy-rlp = { workspace = true, optional = true }
hex = { version = "0.4", default-features = false }

[features]
default = ["std"]
std = ["serde/std", "alloy-primitives/std", "alloy-consensus/std", "hex/std"]
encoding = ["alloy-eips", "alloy-rlp"]