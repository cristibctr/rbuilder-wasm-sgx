[package]
name = "sgx-wasm-runner"
version = "0.1.0"
edition = "2021"
build = "build.rs"
links = "wamr_sgx"

[dependencies]
libc = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
lazy_static = "1.4"

[build-dependencies]
bindgen = "0.69"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies.cc]
version = "1.0.79"